docker:
  name: Build and Push Docker Images

  runs-on: ubuntu-latest

  needs:
    - backend
    - frontend

  if: github.event_name == 'push'

  permissions:
    contents: read
    packages: write

  steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Backend
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        push: true
        tags: |
          ghcr.io/dulajherath1992-cmd/dev-ops-training-backend:latest
          ghcr.io/dulajherath1992-cmd/dev-ops-training-backend:${{ github.sha }}

    - name: Build and Push Frontend
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        push: true
        tags: |
          ghcr.io/dulajherath1992-cmd/dev-ops-training-frontend:latest
          ghcr.io/dulajherath1992-cmd/dev-ops-training-frontend:${{ github.sha }}