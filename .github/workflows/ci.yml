name: DevOps Training CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # BACKEND CI
  # ==========================================
  backend:
    name: Backend - Go
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build backend
        run: go build ./...

      - name: Test backend
        run: go test ./...


  # ==========================================
  # FRONTEND CI
  # ==========================================
  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build


  # ==========================================
  # BUILD + PUSH DOCKER IMAGES
  # ==========================================
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    # Do not publish Docker images for pull requests
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/dulajherath1992-cmd/dev-ops-training-backend:latest
            ghcr.io/dulajherath1992-cmd/dev-ops-training-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/dulajherath1992-cmd/dev-ops-training-frontend:latest
            ghcr.io/dulajherath1992-cmd/dev-ops-training-frontend:${{ github.sha }}


  # ==========================================
  # UPDATE HELM IMAGE TAGS
  # ==========================================
  update-deployment:
    name: Update Helm Image Tags
    runs-on: ubuntu-latest

    needs:
      - docker

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update backend image tag
        run: |
          sed -i "/dev-ops-training-backend/,/pullPolicy/ s/tag:.*/tag: \"${GITHUB_SHA}\"/" \
            deploy/helm/devops-training/values.yaml

      - name: Update frontend image tag
        run: |
          sed -i "/dev-ops-training-frontend/,/pullPolicy/ s/tag:.*/tag: \"${GITHUB_SHA}\"/" \
            deploy/helm/devops-training/values.yaml

      - name: Show updated values
        run: |
          cat deploy/helm/devops-training/values.yaml

      - name: Commit and Push Helm Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add deploy/helm/devops-training/values.yaml

          git diff --cached --quiet && exit 0

          git commit -m "Deploy ${GITHUB_SHA}"
          git push
