apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: devops-training
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/dulajherath1992-cmd/dev-ops-training.git
    targetRevision: main
    path: deploy/helm/devops-training

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true